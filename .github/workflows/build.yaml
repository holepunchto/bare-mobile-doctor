name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        host:
          - android-arm64
          - android-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm i --ignore-scripts

      - name: Build the app
        run: |
          npx bare-build \
            --host ${{ matrix.host }} \
            --runtime bare-native/runtime \
            --name "Bare Doctor" \
            --identifier to.holepunch.bare.doctor \
            --out build \
            native/index.js

          mv "build/Bare Doctor.apk" "bare-native-doctor-${{ matrix.host }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bare-native-doctor-${{ matrix.host }}
          path: bare-native-doctor-${{ matrix.host }}.apk
