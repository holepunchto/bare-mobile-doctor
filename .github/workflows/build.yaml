name: build

on:
  push:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm i --ignore-scripts

      - name: Build the apps
        run: |
          for host in android-arm64 android-x64; do
            npx bare-build \
              --host "$host" \
              --runtime bare-native/runtime \
              --name "Bare Doctor" \
              --identifier to.holepunch.bare.doctor \
              --out "build/$host" \
              native/index.js

            mv "build/$host/Bare Doctor.apk" "bare-doctor-${GITHUB_SHA::7}-$host.apk"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: bare-doctor-*.apk
