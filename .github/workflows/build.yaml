name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    name: Android / ${{ matrix.host }}
    strategy:
      matrix:
        host:
          - android-arm
          - android-arm64
          - android-ia32
          - android-x64
    steps:
      - uses: holepunchto/actions/node-base@v1

      - name: Build the app
        run: |
          npx bare-build \
            --host ${{ matrix.host }} \
            --runtime bare-native/runtime \
            --name "Bare Doctor" \
            --identifier to.holepunch.bare.doctor \
            --out build \
            native/index.js

          mv "build/Bare Doctor.apk" "bare-native-doctor-${{ matrix.host }}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: bare-native-doctor-${{ matrix.host }}
          path: bare-native-doctor-${{ matrix.host }}.apk
